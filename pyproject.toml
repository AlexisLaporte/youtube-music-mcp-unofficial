[project]
name = "ytmusic-manager"
version = "0.1.0"
description = "MCP server for YouTube Music: audit liked songs, organize playlists, search, like — from Claude or any MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alexis Laporte" }]
keywords = ["mcp", "youtube-music", "playlists", "model-context-protocol"]
dependencies = ["fastmcp>=2,<3", "ytmusicapi>=1.12,<2"]

[project.urls]
Homepage = "https://ytmusic.tuls.me"
Repository = "https://github.com/AlexisLaporte/youtube-music-mcp-unofficial"

[project.scripts]
ytmusic-manager = "ytmusic_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytmusic_mcp"]
