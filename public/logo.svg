<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#grad)"/>

  <!-- Simple equalizer bars -->
  <g transform="translate(50, 50)">
    <rect x="0" y="40" width="18" height="60" rx="9" fill="white" opacity="0.9"/>
    <rect x="28" y="20" width="18" height="80" rx="9" fill="white"/>
    <rect x="56" y="50" width="18" height="50" rx="9" fill="white" opacity="0.85"/>
    <rect x="84" y="30" width="18" height="70" rx="9" fill="white" opacity="0.95"/>
  </g>
</svg>
